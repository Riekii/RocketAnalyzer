services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${SCHEME:-https}://${DOMAIN:?Define DOMAIN en el archivo .env}
    # Only reachable from the server itself; Caddy publishes the site.
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${SCHEME:-https}://${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
